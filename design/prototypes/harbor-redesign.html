<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Harbor — design preview</title>
    <style>
      :root {
        color-scheme: light;
        --canvas: #fff;
        --rail: #f5f5f5;
        --selected: #e9e9e9;
        --edge: #dedede;
        --muted: #737373;
        --ink: #191919;
        --soft: #fafafa;
        --rail-width: 260px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: var(--ink);
        font-size: 14px;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--canvas);
      }
      button,
      textarea,
      select {
        font: inherit;
        color: inherit;
      }
      button {
        cursor: pointer;
        border: 0;
        background: none;
      }
      button:focus-visible,
      a:focus-visible,
      select:focus-visible,
      summary:focus-visible {
        outline: 2px solid #737373;
        outline-offset: 3px;
      }
      button:disabled {
        cursor: default;
      }
      svg {
        width: 19px;
        height: 19px;
        stroke: currentColor;
        stroke-width: 1.65;
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
        flex: none;
      }
      button:hover {
        background: #eaeaea;
      }
      button {
        transition: background 0.12s;
      }
      .icon-button {
        width: 30px;
        height: 30px;
        border-radius: 7px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        color: var(--muted);
        flex: none;
      }
      .app {
        display: flex;
        height: 100dvh;
        min-height: 420px;
      }
      .sidebar {
        width: var(--rail-width);
        background: var(--rail);
        flex: none;
        display: flex;
        flex-direction: column;
        padding: 21px 12px 14px;
        overflow-y: auto;
      }
      .sidebar-resize {
        width: 8px;
        margin: 0 -4px;
        position: relative;
        z-index: 2;
        flex: none;
        cursor: col-resize;
        touch-action: none;
      }
      .sidebar-resize::after {
        content: "";
        position: absolute;
        inset: 0 3px;
        background: transparent;
      }
      .sidebar-resize:hover::after,
      .sidebar-resize:focus-visible::after,
      .resizing .sidebar-resize::after {
        background: #aaa;
      }
      .sidebar-resize:focus-visible {
        outline: 2px solid #737373;
        outline-offset: -2px;
      }
      .resizing,
      .resizing * {
        cursor: col-resize !important;
        user-select: none !important;
      }
      .brand-row {
        display: flex;
        align-items: center;
        padding: 0 10px;
        gap: 10px;
        height: 31px;
      }
      .brand-mark {
        width: 24px;
        height: 25px;
        stroke-width: 1.8;
      }
      .brand {
        font-size: 20px;
        font-weight: 650;
        letter-spacing: -0.65px;
      }
      .brand-row .icon-button {
        margin-left: auto;
      }
      .new-chat {
        display: flex;
        align-items: center;
        width: 100%;
        gap: 11px;
        text-align: left;
        padding: 11px 12px;
        margin-top: 27px;
        border-radius: 8px;
        font-size: 14px;
      }
      .new-chat svg {
        width: 18px;
        height: 18px;
      }
      .shortcut {
        margin-left: auto;
        color: #8a8a8a;
        font-size: 11px;
      }
      .project-heading {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 4px 0 10px;
        margin: 29px 0 8px;
        color: var(--muted);
        font-size: 12px;
        font-weight: 500;
      }
      .project {
        margin-bottom: 8px;
      }
      .project-row {
        display: flex;
        align-items: center;
        border-radius: 8px;
        min-height: 37px;
        padding-right: 4px;
      }
      .project-row:hover,
      .project-row:focus-within {
        background: #ededed;
      }
      .project-toggle {
        display: flex;
        align-items: center;
        gap: 9px;
        padding: 9px 10px;
        min-width: 0;
        text-align: left;
        flex: 1;
        border-radius: 8px;
        font-size: 13px;
      }
      .project-name {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .project-toggle svg {
        width: 18px;
        height: 18px;
        color: #666;
      }
      .project-actions {
        display: flex;
        opacity: 0;
      }
      .project-row:hover .project-actions,
      .project-row:focus-within .project-actions {
        opacity: 1;
      }
      .project-actions .icon-button {
        width: 30px;
        height: 30px;
      }
      .project-actions svg {
        width: 16px;
        height: 16px;
      }
      .sessions {
        padding: 3px 0 4px 24px;
      }
      .session-row {
        display: flex;
        align-items: center;
        border-radius: 7px;
        margin: 2px 0;
        padding-right: 4px;
      }
      .session-row:hover,
      .session-row:focus-within {
        background: #ededed;
      }
      .session {
        display: block;
        flex: 1;
        min-width: 0;
        padding: 9px 12px;
        border-radius: 7px;
        text-align: left;
        font-size: 12px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        color: #666;
      }
      .session-row.active {
        background: var(--selected);
        color: var(--ink);
      }
      .session-row.active .session {
        color: var(--ink);
      }
      .session-rename {
        opacity: 0;
        width: 30px;
        height: 30px;
      }
      .session-rename svg {
        width: 16px;
        height: 16px;
      }
      .session-row:hover .session-rename,
      .session-row:focus-within .session-rename {
        opacity: 1;
      }
      .sidebar-footer {
        margin-top: auto;
        padding: 24px 11px 0;
        display: flex;
        align-items: center;
        gap: 9px;
        color: var(--muted);
        font-size: 11px;
      }
      .preview-dot {
        width: 6px;
        height: 6px;
        border: 1px solid #8b8b8b;
        border-radius: 50%;
      }
      .main {
        display: flex;
        flex: 1;
        min-width: 0;
        flex-direction: column;
        position: relative;
      }
      .topbar {
        height: 65px;
        flex: none;
        display: flex;
        align-items: center;
        padding: 0 31px;
        gap: 10px;
      }
      .breadcrumbs {
        display: flex;
        align-items: center;
        gap: 10px;
        min-width: 0;
        font-size: 12px;
        color: var(--muted);
      }
      .breadcrumbs svg {
        width: 16px;
        height: 16px;
      }
      .breadcrumbs .slash {
        color: #b4b4b4;
      }
      .breadcrumbs strong {
        color: #333;
        font-size: 13px;
        font-weight: 500;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .topbar-actions {
        margin-left: auto;
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .sample-label {
        font-size: 10px;
        color: var(--muted);
        padding: 4px 7px;
        border: 1px solid #e8e8e8;
        border-radius: 5px;
        white-space: nowrap;
      }
      .mobile-toggle {
        display: none;
      }
      .scroll-area {
        flex: 1;
        overflow-y: auto;
        scroll-behavior: smooth;
        padding: 26px 34px 20px;
      }
      .conversation {
        max-width: 760px;
        margin: 0 auto;
        font-size: 15px;
        line-height: 1.75;
      }
      .user-message {
        display: flex;
        justify-content: flex-end;
        margin: 12px 0 32px;
      }
      .user-bubble {
        background: #f1f1f1;
        padding: 12px 18px;
        border-radius: 18px 18px 4px 18px;
        max-width: 85%;
        font-size: 14px;
        line-height: 1.6;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      .assistant-message {
        padding: 0 1px;
        overflow-wrap: anywhere;
      }
      .assistant-label {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 12px;
        font-weight: 600;
        margin: 0 0 17px;
      }
      .assistant-label svg {
        width: 17px;
        height: 18px;
      }
      .assistant-message p {
        margin: 0 0 17px;
      }
      .assistant-message h2 {
        font-size: 17px;
        letter-spacing: -0.25px;
        font-weight: 600;
        margin: 24px 0 9px;
      }
      .assistant-message ul {
        padding-left: 21px;
        margin: 6px 0 18px;
      }
      .assistant-message li {
        padding-left: 3px;
        margin: 6px 0;
      }
      .assistant-message strong {
        font-weight: 600;
      }
      .assistant-message code {
        font:
          12px ui-monospace,
          SFMono-Regular,
          Consolas,
          monospace;
        background: #f2f2f2;
        border-radius: 4px;
        padding: 3px 5px;
      }
      .sample-details {
        margin: 23px 0 18px;
        border-top: 1px solid #ececec;
        border-bottom: 1px solid #ececec;
      }
      .sample-details summary {
        cursor: pointer;
        list-style: none;
        padding: 13px 0;
        display: flex;
        align-items: center;
        gap: 9px;
        font-size: 12px;
        color: var(--muted);
      }
      .sample-details summary svg {
        width: 14px;
        height: 14px;
      }
      .sample-details[open] summary svg {
        transform: rotate(90deg);
      }
      .sample-details p {
        font-size: 12px;
        color: var(--muted);
        margin: 0 0 14px;
      }
      .message-actions {
        display: flex;
        gap: 3px;
        margin: 15px 0 10px;
      }
      .message-actions .icon-button {
        width: 28px;
        height: 28px;
      }
      .message-actions svg {
        width: 15px;
        height: 15px;
      }
      .composer-area {
        padding: 15px 34px 18px;
        background: #fff;
        flex: none;
      }
      .composer-wrap {
        max-width: 760px;
        margin: auto;
      }
      .composer {
        border: 1px solid #ddd;
        border-radius: 18px;
        padding: 14px 15px 10px;
        background: white;
        box-shadow: 0 3px 16px #00000005;
      }
      .composer:focus-within {
        border-color: #adadad;
        box-shadow: 0 3px 20px #00000007;
      }
      .composer textarea {
        border: 0;
        outline: 0;
        resize: none;
        display: block;
        width: 100%;
        height: 24px;
        max-height: 160px;
        min-height: 24px;
        overflow-y: hidden;
        line-height: 24px;
        font-size: 14px;
        background: transparent;
        padding: 0 2px;
      }
      .composer textarea::placeholder {
        color: #929292;
      }
      .composer-tools {
        display: flex;
        align-items: center;
        gap: 7px;
        margin-top: 12px;
        min-width: 0;
      }
      .select-wrap {
        display: flex;
        align-items: center;
        gap: 3px;
        position: relative;
      }
      .select-wrap select {
        max-width: 180px;
        appearance: none;
        border: 0;
        padding: 5px 19px 5px 5px;
        background: transparent;
        font-size: 11px;
        cursor: pointer;
        border-radius: 5px;
      }
      .select-wrap:after {
        content: "";
        position: absolute;
        right: 6px;
        top: 10px;
        width: 5px;
        height: 5px;
        border-right: 1px solid #888;
        border-bottom: 1px solid #888;
        transform: rotate(45deg);
        pointer-events: none;
      }
      .select-wrap svg {
        width: 14px;
        height: 14px;
        color: #737373;
      }
      .model-control {
        margin-left: auto;
      }
      .send {
        width: 30px;
        height: 30px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #191919;
        color: white;
        margin-left: 4px;
        flex: none;
      }
      .send:hover {
        background: #444;
      }
      .send:disabled {
        background: #ececec;
        color: #aaa;
      }
      .send svg {
        width: 17px;
        height: 17px;
      }
      .composer-note {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        margin: 10px 4px 0;
        font-size: 10px;
        color: #858585;
      }
      .empty {
        min-height: 100%;
        display: flex;
        justify-content: center;
        flex-direction: column;
        max-width: 760px;
        margin: auto;
        padding-bottom: 60px;
      }
      .empty .brand-mark {
        width: 34px;
        height: 38px;
        margin-bottom: 17px;
        color: #333;
      }
      .empty h1 {
        font-size: 27px;
        letter-spacing: -0.8px;
        font-weight: 550;
        margin: 0 0 9px;
      }
      .empty p {
        font-size: 14px;
        color: var(--muted);
        margin: 0;
        line-height: 1.7;
      }
      .starter-list {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin-top: 28px;
      }
      .starter {
        border: 1px solid #e5e5e5;
        border-radius: 8px;
        padding: 9px 12px;
        color: #666;
        font-size: 12px;
      }
      .toast {
        position: fixed;
        bottom: 150px;
        left: calc(50% + var(--rail-width) / 2);
        transform: translateX(-50%);
        padding: 10px 16px;
        background: #252525;
        color: white;
        border-radius: 9px;
        font-size: 12px;
        box-shadow: 0 4px 20px #0002;
        z-index: 30;
        max-width: calc(100% - 30px);
      }
      .toast:empty {
        display: none;
      }
      .menu {
        position: absolute;
        z-index: 20;
        right: 27px;
        top: 54px;
        width: 170px;
        border: 1px solid #e4e4e4;
        border-radius: 10px;
        background: white;
        box-shadow: 0 8px 28px #0000000d;
        padding: 5px;
      }
      .menu button {
        display: block;
        width: 100%;
        text-align: left;
        padding: 9px;
        border-radius: 6px;
        font-size: 12px;
      }
      .backdrop {
        display: none;
      }
      [hidden] {
        display: none !important;
      }
      @media (hover: none) {
        .project-actions,
        .session-rename {
          opacity: 1;
        }
      }
      @media (min-width: 1600px) {
        .scroll-area {
          padding-top: 55px;
        }
        .composer-area {
          padding-bottom: 25px;
        }
      }
      @media (max-width: 1000px) {
        .topbar {
          padding: 0 24px;
        }
        .scroll-area,
        .composer-area {
          padding-left: 24px;
          padding-right: 24px;
        }
        .shortcut {
          display: none;
        }
      }
      @media (max-width: 700px) {
        .sidebar-resize {
          display: none;
        }
        .sidebar {
          position: fixed;
          inset: 0 auto 0 0;
          width: 260px;
          z-index: 40;
          transform: translateX(-100%);
          transition: transform 0.18s;
        }
        .sidebar.open {
          transform: translateX(0);
        }
        .backdrop.open {
          display: block;
          position: fixed;
          inset: 0;
          background: #0003;
          z-index: 35;
        }
        .mobile-toggle {
          display: inline-flex;
        }
        .topbar {
          height: 57px;
          padding: 0 13px;
          gap: 6px;
        }
        .breadcrumbs {
          gap: 7px;
        }
        .breadcrumbs .project-crumb,
        .breadcrumbs .slash {
          display: none;
        }
        .topbar-actions {
          gap: 3px;
        }
        .sample-label {
          font-size: 9px;
        }
        .scroll-area {
          padding: 16px 20px;
        }
        .conversation {
          font-size: 14px;
        }
        .user-bubble {
          max-width: 94%;
        }
        .composer-area {
          padding: 10px 13px 14px;
        }
        .composer {
          padding: 12px 12px 9px;
        }
        .composer-note {
          font-size: 9px;
        }
        .composer-note span:last-child {
          display: none;
        }
        .select-wrap select {
          font-size: 10px;
          max-width: 136px;
        }
        .effort-control {
          display: none;
        }
        .composer-tools {
          gap: 2px;
        }
        .empty h1 {
          font-size: 25px;
        }
        .empty {
          padding-bottom: 35px;
        }
        .toast {
          left: 50%;
        }
        .assistant-message h2 {
          font-size: 16px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          scroll-behavior: auto !important;
          transition: none !important;
        }
      }
      .example-dialog {
        width: min(560px, calc(100% - 32px));
        max-height: calc(100dvh - 32px);
        overflow: auto;
        border: 1px solid var(--edge);
        border-radius: 14px;
        padding: 24px;
        background: var(--canvas);
        box-shadow: 0 16px 64px #00000018;
        color: var(--ink);
      }
      .example-dialog::backdrop {
        background: #0003;
      }
      .example-heading {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 20px;
      }
      .example-heading h2 {
        font-size: 20px;
        margin: 0;
        font-weight: 600;
        letter-spacing: -0.4px;
      }
      .example-dialog p {
        font-size: 13px;
        line-height: 1.6;
        color: var(--muted);
      }
      .example-dialog button:not(.icon-button),
      .example-dialog select {
        border: 1px solid var(--edge);
        border-radius: 8px;
        min-height: 36px;
        padding: 8px 12px;
        background: var(--canvas);
        font-size: 12px;
      }
      .example-dialog button:hover {
        background: var(--selected);
      }
      .example-dialog .example-primary {
        background: var(--ink) !important;
        color: var(--canvas);
      }
      .example-field {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        font-size: 12px;
        margin: 20px 0;
      }
      .example-path {
        padding: 12px;
        background: var(--rail);
        border-radius: 8px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
        font-size: 12px;
      }
      .example-folders {
        display: grid;
        gap: 4px;
        margin: 12px 0;
        min-height: 90px;
      }
      .example-folders button {
        display: flex;
        gap: 9px;
        align-items: center;
        text-align: left;
      }
      .example-notice {
        padding: 12px 14px;
        background: var(--soft);
        border: 1px solid var(--edge);
        border-radius: 8px;
        font-size: 12px;
        line-height: 1.6;
        margin: 14px 0;
      }
      .example-footer {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
        margin-top: 20px;
      }
      @media (max-width: 700px) {
        .example-dialog {
          padding: 18px;
        }
      }
      /* Conversation Markdown: the canonical guide's neutral reading surfaces. */
      .markdown-body {
        white-space: normal;
        min-width: 0;
      }
      .markdown-body > :first-child {
        margin-top: 0;
      }
      .markdown-body > :last-child {
        margin-bottom: 0;
      }
      .markdown-body p {
        margin: 0 0 17px;
      }
      .markdown-body :is(h1, h2, h3, h4, h5, h6) {
        font-size: 17px;
        font-weight: 600;
        letter-spacing: -0.25px;
        line-height: 1.5;
        margin: 24px 0 9px;
      }
      .markdown-body :is(ul, ol) {
        padding-left: 24px;
        margin: 6px 0 18px;
      }
      .markdown-body li {
        margin: 6px 0;
      }
      .markdown-body li > :is(ul, ol) {
        margin-bottom: 0;
      }
      .markdown-body strong {
        font-weight: 600;
      }
      .markdown-body code {
        font:
          12px ui-monospace,
          SFMono-Regular,
          Consolas,
          monospace;
        background: #f2f2f2;
        border-radius: 4px;
        padding: 3px 5px;
      }
      .markdown-body pre {
        max-width: 100%;
        overflow: auto;
        white-space: pre;
        overflow-wrap: normal;
        padding: 12px;
        margin: 17px 0;
        border: 1px solid var(--edge);
        border-radius: 8px;
        background: var(--soft);
        line-height: 1.6;
      }
      .markdown-body pre code {
        padding: 0;
        border-radius: 0;
        background: transparent;
      }
      .markdown-body blockquote {
        margin: 17px 0;
        padding: 0 0 0 16px;
        border-left: 3px solid var(--edge);
        color: var(--muted);
      }
      .markdown-body a {
        color: inherit;
        text-decoration: underline;
        text-underline-offset: 3px;
      }
      .markdown-body a:hover {
        color: var(--muted);
      }
      .markdown-body hr {
        border: 0;
        border-top: 1px solid var(--edge);
        margin: 24px 0;
      }
      .markdown-scroll {
        max-width: 100%;
        overflow: auto;
        margin: 17px 0;
      }
      .markdown-body table {
        width: 100%;
        border-collapse: collapse;
        font-size: inherit;
      }
      .markdown-body :is(th, td) {
        border: 1px solid var(--edge);
        padding: 8px 12px;
        text-align: left;
        min-width: 100px;
      }
      .markdown-body th {
        background: var(--soft);
        font-weight: 600;
      }
      .markdown-body .markdown-align-center {
        text-align: center;
      }
      .markdown-body .markdown-align-right {
        text-align: right;
      }
      .markdown-body .contains-task-list {
        list-style: none;
        padding-left: 0;
      }
      .markdown-body .task-list-item input {
        width: auto;
        margin-right: 8px;
        accent-color: var(--ink);
      }

      const escapeHTML = (value) =>
        String(value).replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[c],
        );
      let nextId = 20,
        activeId = 1;
      const projects = [
        {
          id: 1,
          name: "codex-harbor",
          open: true,
          chats: [
            {
              id: 1,
              title: "A quieter workspace",
              sample: true,
              occupied: true,
              runtime: "idle",
              messages: [],
            },
            { id: 2, title: "Understand the project", occupied: true, runtime: "protected", messages: [] },
            { id: 3, title: "Plan the next release", runtime: "unknown", messages: [] },
            ...Array.from({length: 8}, (_, i) => ({id: i + 10, title: `Earlier conversation ${i + 1}`, messages: []})),
          ],
        },
        {
          id: 2,
          name: "personal-website",
          open: false,
          chats: [{ id: 4, title: "New chat", messages: [] }],
        },
        {
          id: 3,
          name: "notes",
          open: false,
          chats: [{ id: 5, title: "New chat", messages: [] }],
        },
      ];
      for (const project of projects) project.chats.forEach((chat, index) => {chat.createdAt = projects.length * 100 - index;});
      function current() {
        for (const project of projects) {
          const chat = project.chats.find((c) => c.id === activeId);
          if (chat) return { project, chat };
        }
      }
      let toastTimer;
      function notify(text) {
        $("toast").textContent = text;
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => ($("toast").textContent = ""), 3600);
      }
      const mobileQuery = window.matchMedia("(max-width:700px)");
      const sidebarResize = $("sidebarResize");
      let preferredSidebarWidth = 260;
      let dragPointer = null;
      let dragStartX = 0;
      let dragStartWidth = 260;
      function sidebarBounds() {
        return { min: 220, max: Math.min(400, window.innerWidth - 440) };
      }
      function updateSidebarWidth() {
        const { min, max } = sidebarBounds();
        const width = mobileQuery.matches
          ? preferredSidebarWidth
          : Math.max(min, Math.min(max, preferredSidebarWidth));
        document.documentElement.style.setProperty(
          "--rail-width",
          `${width}px`,
        );
        sidebarResize.setAttribute("aria-valuemax", String(Math.max(min, max)));
        sidebarResize.setAttribute("aria-valuenow", String(Math.round(width)));
        sidebarResize.setAttribute(
          "aria-valuetext",
          `${Math.round(width)} pixels`,
        );
      }
      function finishSidebarResize() {
        if (
          dragPointer !== null &&
          sidebarResize.hasPointerCapture(dragPointer)
        )
          sidebarResize.releasePointerCapture(dragPointer);
        dragPointer = null;
        document.body.classList.remove("resizing");
      }
      sidebarResize.addEventListener("pointerdown", (event) => {
        if (mobileQuery.matches || event.button !== 0 || dragPointer !== null)
          return;
        event.preventDefault();
        dragPointer = event.pointerId;
        dragStartX = event.clientX;
        dragStartWidth = $("sidebar").getBoundingClientRect().width;
        sidebarResize.setPointerCapture(dragPointer);
        sidebarResize.focus();
        document.body.classList.add("resizing");
      });
      sidebarResize.addEventListener("pointermove", (event) => {
        if (event.pointerId !== dragPointer) return;
        const { min, max } = sidebarBounds();
        preferredSidebarWidth = Math.max(
          min,
          Math.min(max, dragStartWidth + event.clientX - dragStartX),
        );
        updateSidebarWidth();
        resize();
      });
      for (const event of ["pointerup", "pointercancel", "lostpointercapture"])
        sidebarResize.addEventListener(event, finishSidebarResize);
      window.addEventListener("blur", finishSidebarResize);
      sidebarResize.addEventListener("keydown", (event) => {
        if (mobileQuery.matches) return;
        const { min, max } = sidebarBounds();
        let width = $("sidebar").getBoundingClientRect().width;
        if (event.key === "ArrowLeft") width -= 10;
        else if (event.key === "ArrowRight") width += 10;
        else if (event.key === "Home") width = min;
        else if (event.key === "End") width = max;
        else return;
        event.preventDefault();
        preferredSidebarWidth = Math.max(min, Math.min(max, width));
        updateSidebarWidth();
        resize();
      });
      window.addEventListener("resize", () => {
        finishSidebarResize();
        updateSidebarWidth();
        resize();
      });
      function syncSidebar() {
        const mobile = mobileQuery.matches,
          open = $("sidebar").classList.contains("open");
        $("sidebar").inert = mobile && !open;
        $("sidebar").setAttribute("aria-hidden", String(mobile && !open));
        document.querySelector("main").inert = mobile && open;
      }
      function closeSidebar() {
        const restore =
          mobileQuery.matches && $("sidebar").contains(document.activeElement);
        $("sidebar").classList.remove("open");

          $("confirmRelease").onclick = () => {
            chat.occupied = false;
            chat.runtime = null;
            $("actionDialog").close();
            renderProjects();
            notify("Background processes stopped. Runtime resources released.");
          };
        };
      }
      function showProject(id, opener) {
        const project = projects.find((p) => p.id === id);
        showDialog(
          "Project details",
          `<p><strong>${escapeHTML(project.name)}</strong></p><p>Environment: Local · ready</p><p>Workspace: original project folder</p><p>Conversations share this directory and run independently. Coordinate edits to shared files.</p><ul aria-label="Shared directory conversations">${project.chats.filter(c => c.runtime).map(c => `<li>${escapeHTML(c.title)}: ${runtimeText[c.runtime]}</li>`).join("") || "<li>No retained conversation runtimes.</li>"}</ul><p>Project storage: sample usage available.</p><p>Account and global configuration are available in Settings.</p>`,
          opener,
        );
      }
      $("settingsButton").onclick = () => {
        showDialog(
          "Settings",
          `<div class="action-list"><button id="accountSettings">${icon("settings")}Codex account</button><button id="previewSettings">${icon("search")}About this preview</button></div>`,
        );
        $("accountSettings").onclick = () =>
          showDialog(
            "Account settings",
            "<p><strong>Codex subscription account ready</strong></p><p>For personal VPS account changes, use the trusted SSH account setup command. Finish or stop active work before changing accounts.</p><p>This preview contains no credentials or account connection.</p>",
            $("settingsButton"),
          );
        $("previewSettings").onclick = () =>
          showDialog(
            "About this preview",
            "<p>Local sample data only. No Codex requests, feedback requests, files or analytics are sent. Refresh resets chats, resources, votes and settings.</p>",
            $("settingsButton"),
          );
      };
      $("searchButton").onclick = () => {
        $("actionDialog").querySelector(".search-results")?.remove();
        filterProject = current().project.id;
        showDialog(
          "Search and filters",
          `<label class="search-input-row">${icon("search")}<span class="sr-only">Search chat titles</span><input id="searchText" value="${escapeHTML(search)}" placeholder="Search conversations"></label><div class="search-scope-row"><span>${icon("folder")}${escapeHTML(current().project.name)}</span><label><span class="sr-only">Show conversations</span><select id="archiveFilter"><option value="active">Active conversations</option><option value="archived">Archived conversations</option><option value="all">All conversations</option></select></label></div>`,
        );
        $("archiveFilter").value = archiveFilter;
        $("searchText").focus();
        const results = document.createElement("div");
        results.className = "search-results";
        $("actionBody").append(results);
        let depth = 5;
        function renderSearch() {
          search = $("searchText").value;
          archiveFilter = $("archiveFilter").value;
          const matches = current().project.chats.filter(c => c.title.toLowerCase().includes(search.toLowerCase()) && (archiveFilter === "all" || !!c.archived === (archiveFilter === "archived")));
          results.innerHTML = matches.slice(0, depth).map(c => `<button data-result="${c.id}">${icon("compose")}<span>${escapeHTML(c.title)}</span></button>`).join("") || "<p>No matching conversations</p>";
          if (matches.length > depth) results.innerHTML += '<button data-search-more>Show more</button>';
          results.onclick = event => {
            if (event.target.closest("[data-search-more]")) {depth += 5; renderSearch(); return;}
            const row = event.target.closest("[data-result]");
            if (row) {activeId = Number(row.dataset.result); $("actionDialog").close(); renderProjects(); renderChat(); closeSidebar();}
          };
        }
        $("searchText").oninput = () => {depth = 5; renderSearch();};
        $("archiveFilter").onchange = () => {depth = 5; renderSearch();};
        renderSearch();
      };
      function updateEffort() {
        const values =
          $("model").value === "GPT-6 Astra"
            ? ["Low", "Medium", "High", "Extra High", "Max"]
            : ["Low", "Medium", "High"];
        const previous = $("effort").value;
        $("effort").innerHTML = values
          .map((value) => `<option>${value}</option>`)
          .join("");
        $("effort").value = values.includes(previous) ? previous : "Medium";
      }
      $("model").onchange = updateEffort;
      updateEffort();
      let selectedFiles = [];
      function renderAttachments() {
        $("attachmentList").replaceChildren();
        selectedFiles.forEach((file, index) => {
          const row = document.createElement("div"); row.className = "attachment-item";
          const name = document.createElement("span"); name.textContent = file.name + " · " + Math.ceil(file.size / 1024) + " KiB";
          const remove = document.createElement("button"); remove.type = "button"; remove.textContent = "Remove"; remove.setAttribute("aria-label", "Remove " + file.name);
          remove.onclick = () => {selectedFiles.splice(index, 1); renderAttachments();}; row.append(name, remove); $("attachmentList").append(row);
        });
      }
      function addFiles(files) {
        if ($("attachFile").disabled) return;
        const rejected = [];
        for(const file of files) {
          if(!file.size || file.size > 10 * 1024 * 1024 || selectedFiles.length >= 4 || selectedFiles.reduce((sum,f) => sum+f.size,0)+file.size > 20*1024*1024) rejected.push(file.name);
          else selectedFiles.push(file);
        }
        $("attachmentError").hidden = !rejected.length;
        $("attachmentError").textContent = rejected.length ? "Not added: " + rejected.join(", ") + ". Limit: 10 MiB per file, four files / 20 MiB per message." : "";
        renderAttachments();
      }
      $("attachFile").onclick = () => $("attachmentInput").click();
      $("attachmentInput").onchange = event => {addFiles([...event.target.files]); event.target.value = "";};
      $("composer").addEventListener("paste", event => {if(event.clipboardData.files.length && !$("attachFile").disabled) {event.preventDefault(); addFiles([...event.clipboardData.files]);}});
      $("composer").addEventListener("dragover", event => {if(event.dataTransfer.types.includes("Files")) event.preventDefault();});
      $("composer").addEventListener("drop", event => {event.preventDefault(); if(!$("attachFile").disabled) addFiles([...event.dataTransfer.files]);});
      $("attachmentState").onchange = () => {
        const value = $("attachmentState").value;
        const reserved = ["disabled", "saving", "recovery"].includes(value);
        $("attachFile").disabled = reserved;
        $("attachmentInput").disabled = reserved;
        $("prompt").disabled = reserved;
        $("send").disabled = value !== "ready" || !$("prompt").value.trim();
        $("attachmentList").querySelectorAll("button").forEach(button => button.disabled = reserved);
        $("attachmentStatus").hidden = value !== "loading";
        $("attachmentStatus").innerHTML = 'Uploading <progress value="40" max="100"></progress> <button type="button" id="pauseUpload">Pause upload</button>';
        $("attachmentError").hidden = value !== "error";
        $("attachmentError").innerHTML = 'Upload paused. <button type="button" id="retryUpload">Retry upload</button>';
        $("pauseUpload").onclick = () => {$("attachmentState").value = "error"; $("attachmentState").onchange();};
        $("retryUpload").onclick = () => {$("attachmentState").value = "loading"; $("attachmentState").onchange();};
        if (value === "saving") {
          $("attachmentStatus").hidden = false;
          $("attachmentStatus").textContent = "Saving draft…";
        }
        if (value === "recovery") {
          selectedFiles = [];
          renderAttachments();
          $("prompt").value = "";
          $("attachmentError").hidden = false;
          $("attachmentError").innerHTML = 'Message accepted. Reload the saved draft to continue. <button type="button" id="reloadDraft">Reload saved draft</button>';
          $("reloadDraft").onclick = () => {$("attachmentState").value = "ready"; $("attachmentState").onchange();};
        }
      };
      let followBottom = true;
      $("scrollArea").addEventListener("scroll", () => {const e = $("scrollArea"); followBottom = e.scrollHeight-e.scrollTop-e.clientHeight < 100;});
      new ResizeObserver(() => {const e = $("scrollArea"); e.style.setProperty("--composer-scroll-padding", (document.querySelector(".composer-area").offsetHeight+20)+"px"); if(followBottom)e.scrollTop = e.scrollHeight;}).observe($("conversation"));
      new ResizeObserver(() => {const e = $("scrollArea"); e.style.setProperty("--composer-scroll-padding", (document.querySelector(".composer-area").offsetHeight+20)+"px"); if(followBottom)e.scrollTop=e.scrollHeight;}).observe(document.querySelector(".composer-area"));
      renderChat();
      syncSidebar();
      updateSidebarWidth();
    </script>
  </body>
</html>
