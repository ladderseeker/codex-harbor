name: ${HARBOR_INSTANCE_ID:?Set a unique HARBOR_INSTANCE_ID}
services:
  postgres:
    image: postgres:17.6-bookworm
    environment:
      POSTGRES_USER: harbor
      POSTGRES_PASSWORD: ${HARBOR_DATABASE_PASSWORD:?Set an instance-specific database password}
      POSTGRES_DB: harbor
    ports:
      - "127.0.0.1:${HARBOR_DATABASE_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U harbor -d harbor"]
      interval: 2s
      timeout: 2s
      retries: 30
    networks: [control]
    labels:
      org.codex-harbor.instance: ${HARBOR_INSTANCE_ID}
  caddy:
    image: caddy:2.10.2-alpine
    ports:
      - "127.0.0.1:${HARBOR_HTTPS_PORT:-3443}:3443"
    environment:
      HARBOR_API_PORT: ${HARBOR_API_PORT:-3000}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [control]
    labels:
      org.codex-harbor.instance: ${HARBOR_INSTANCE_ID}
volumes:
  postgres-data:
  caddy-data:
  caddy-config:
networks:
  control:
